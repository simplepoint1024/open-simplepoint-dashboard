name: open-simplepoint

x-oci-build-args: &oci-build-args
  OCI_IMAGE_VERSION: ${SIMPLEPOINT_IMAGE_VERSION:-dev}
  OCI_IMAGE_REVISION: ${SIMPLEPOINT_IMAGE_REVISION:-unknown}
  OCI_IMAGE_SOURCE: ${SIMPLEPOINT_IMAGE_SOURCE:-https://github.com/simplepoint1024/open-simplepoint-dashboard}

services:
  postgres:
    image: ${SIMPLEPOINT_POSTGRES_IMAGE:-somesimpled/open-simplepoint-postgres:${SIMPLEPOINT_IMAGE_TAG:-local}}
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
      args: *oci-build-args
    environment:
      POSTGRES_DB: simplepoint
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    expose:
      - "5432"
    volumes:
      - simplepoint_postgres_data:/var/lib/postgresql/data
    networks:
      - default
      - runtime-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d simplepoint"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - simplepoint_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${SIMPLEPOINT_MINIO_ROOT_USER:-simplepoint}
      MINIO_ROOT_PASSWORD: ${SIMPLEPOINT_MINIO_ROOT_PASSWORD:-simplepoint123}
    ports:
      - "${SIMPLEPOINT_MINIO_API_PORT:-19000}:9000"
      - "${SIMPLEPOINT_MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - simplepoint_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${SIMPLEPOINT_MINIO_ROOT_USER:-simplepoint}
      MINIO_ROOT_PASSWORD: ${SIMPLEPOINT_MINIO_ROOT_PASSWORD:-simplepoint123}
      MINIO_BUCKET: ${SIMPLEPOINT_MINIO_BUCKET:-simplepoint}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mc alias set local "$$MINIO_ENDPOINT" "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  consul:
    image: hashicorp/consul:1.20
    restart: unless-stopped
    command: ["agent", "-dev", "-client=0.0.0.0", "-ui"]
    ports:
      - "${SIMPLEPOINT_CONSUL_HTTP_PORT:-8500}:8500"
      - "${SIMPLEPOINT_CONSUL_DNS_PORT:-8600}:8600"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8500/v1/status/leader >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  bootstrap:
    image: ${SIMPLEPOINT_BOOTSTRAP_IMAGE:-somesimpled/open-simplepoint-bootstrap:${SIMPLEPOINT_IMAGE_TAG:-local}}
    build:
      context: .
      dockerfile: docker/bootstrap/Dockerfile
      args: *oci-build-args
    environment:
      CONSUL_ADDR: http://consul:8500
      PUBLIC_HOST: ${SIMPLEPOINT_PUBLIC_HOST:-localhost}
      CONFIG_PROFILE: compose
    depends_on:
      consul:
        condition: service_healthy
    restart: "no"

  authorization:
    image: ${SIMPLEPOINT_AUTH_IMAGE:-somesimpled/open-simplepoint-authorization:${SIMPLEPOINT_IMAGE_TAG:-local}}
    restart: unless-stopped
    build:
      context: .
      dockerfile: simplepoint-services/simplepoint-service-authorization/Dockerfile
      args: *oci-build-args
    environment:
      SPRING_PROFILES_ACTIVE: dev,compose
      SIMPLEPOINT_WAIT_FOR: postgres:5432,redis:6379,consul:8500,minio:9000
      SIMPLEPOINT_WAIT_FOR_URLS: http://consul:8500/v1/kv/simplepoint/bootstrap/status?raw
      SIMPLEPOINT_WAIT_TIMEOUT: 240
      SIMPLEPOINT_AUTHORIZATION_SERVICE_CLIENT_SECRET: ${SIMPLEPOINT_AUTHORIZATION_SERVICE_CLIENT_SECRET:-dev-authorization-service-secret}
      SIMPLEPOINT_COMMON_SERVICE_CLIENT_SECRET: ${SIMPLEPOINT_COMMON_SERVICE_CLIENT_SECRET:-dev-common-service-secret}
      SIMPLEPOINT_AUDITING_SERVICE_CLIENT_SECRET: ${SIMPLEPOINT_AUDITING_SERVICE_CLIENT_SECRET:-dev-auditing-service-secret}
      SIMPLEPOINT_DNA_SERVICE_CLIENT_SECRET: ${SIMPLEPOINT_DNA_SERVICE_CLIENT_SECRET:-dev-dna-service-secret}
      SIMPLEPOINT_AI_SERVICE_CLIENT_SECRET: ${SIMPLEPOINT_AI_SERVICE_CLIENT_SECRET:-dev-ai-service-secret}
      SIMPLEPOINT_HOST_SERVICE_CLIENT_SECRET: ${SIMPLEPOINT_HOST_SERVICE_CLIENT_SECRET:-dev-host-service-secret}
      SIMPLEPOINT_OAUTH2_EXTERNAL_PROVIDER_CREDENTIAL_ENCRYPTION_KEY: ${SIMPLEPOINT_OAUTH2_EXTERNAL_PROVIDER_CREDENTIAL_ENCRYPTION_KEY:-dev-oauth2-provider-key-change-me}
    ports:
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/actuator/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  common:
    image: ${SIMPLEPOINT_COMMON_IMAGE:-somesimpled/open-simplepoint-common:${SIMPLEPOINT_IMAGE_TAG:-local}}
    restart: unless-stopped
    build:
      context: .
      dockerfile: simplepoint-services/simplepoint-service-common/Dockerfile
      args: *oci-build-args
    environment:
      SPRING_PROFILES_ACTIVE: dev,compose
      SIMPLEPOINT_ADMIN_EMAIL: ${SIMPLEPOINT_ADMIN_EMAIL:-simplepoint@mail.com}
      SIMPLEPOINT_ADMIN_PASSWORD: ${SIMPLEPOINT_ADMIN_PASSWORD:-123456}
      SIMPLEPOINT_TENANT_MANAGER_EMAIL: ${SIMPLEPOINT_TENANT_MANAGER_EMAIL:-manager@simplepoint.local}
      SIMPLEPOINT_TENANT_MANAGER_PASSWORD: ${SIMPLEPOINT_TENANT_MANAGER_PASSWORD:-123456}
      SIMPLEPOINT_TENANT_MEMBER_EMAIL: ${SIMPLEPOINT_TENANT_MEMBER_EMAIL:-member@simplepoint.local}
      SIMPLEPOINT_TENANT_MEMBER_PASSWORD: ${SIMPLEPOINT_TENANT_MEMBER_PASSWORD:-123456}
      SIMPLEPOINT_DEFAULT_ORGANIZATION_NAME: ${SIMPLEPOINT_DEFAULT_ORGANIZATION_NAME:-SimplePoint 示例组织}
      SIMPLEPOINT_WAIT_FOR: postgres:5432,redis:6379,consul:8500
      SIMPLEPOINT_WAIT_FOR_URLS: http://consul:8500/v1/kv/simplepoint/bootstrap/status?raw
      SIMPLEPOINT_WAIT_TIMEOUT: 240
      SIMPLEPOINT_COMMON_SERVICE_CLIENT_SECRET: ${SIMPLEPOINT_COMMON_SERVICE_CLIENT_SECRET:-dev-common-service-secret}
      SIMPLEPOINT_OAUTH2_EXTERNAL_PROVIDER_CREDENTIAL_ENCRYPTION_KEY: ${SIMPLEPOINT_OAUTH2_EXTERNAL_PROVIDER_CREDENTIAL_ENCRYPTION_KEY:-dev-oauth2-provider-key-change-me}
      SIMPLEPOINT_STORAGE_CREDENTIAL_ENCRYPTION_KEY: ${SIMPLEPOINT_STORAGE_CREDENTIAL_ENCRYPTION_KEY:-dev-storage-credential-encryption-key-change-me}
      SIMPLEPOINT_STORAGE_BOOTSTRAP_MINIO_ENABLED: "true"
      SIMPLEPOINT_MINIO_ROOT_USER: ${SIMPLEPOINT_MINIO_ROOT_USER:-simplepoint}
      SIMPLEPOINT_MINIO_ROOT_PASSWORD: ${SIMPLEPOINT_MINIO_ROOT_PASSWORD:-simplepoint123}
      SIMPLEPOINT_MINIO_BUCKET: ${SIMPLEPOINT_MINIO_BUCKET:-simplepoint}
    ports:
      - "7000:7000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      authorization:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7000/actuator/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  auditing:
    image: ${SIMPLEPOINT_AUDITING_IMAGE:-somesimpled/open-simplepoint-auditing:${SIMPLEPOINT_IMAGE_TAG:-local}}
    restart: unless-stopped
    build:
      context: .
      dockerfile: simplepoint-services/simplepoint-service-auditing/Dockerfile
      args: *oci-build-args
    environment:
      SPRING_PROFILES_ACTIVE: dev,compose
      SIMPLEPOINT_WAIT_FOR: postgres:5432,redis:6379,consul:8500,authorization:9000,common:7000
      SIMPLEPOINT_WAIT_FOR_URLS: http://consul:8500/v1/kv/simplepoint/bootstrap/status?raw
      SIMPLEPOINT_WAIT_TIMEOUT: 240
      SIMPLEPOINT_AUDITING_SERVICE_CLIENT_SECRET: ${SIMPLEPOINT_AUDITING_SERVICE_CLIENT_SECRET:-dev-auditing-service-secret}
    ports:
      - "6000:6000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      authorization:
        condition: service_healthy
      common:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:6000/actuator/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  dna:
    image: ${SIMPLEPOINT_DNA_IMAGE:-somesimpled/open-simplepoint-dna:${SIMPLEPOINT_IMAGE_TAG:-local}}
    restart: unless-stopped
    build:
      context: .
      dockerfile: simplepoint-services/simplepoint-service-dna/Dockerfile
      args: *oci-build-args
    environment:
      SPRING_PROFILES_ACTIVE: dev,compose
      SIMPLEPOINT_WAIT_FOR: postgres:5432,redis:6379,consul:8500,authorization:9000,common:7000
      SIMPLEPOINT_WAIT_FOR_URLS: http://consul:8500/v1/kv/simplepoint/bootstrap/status?raw
      SIMPLEPOINT_WAIT_TIMEOUT: 240
      SIMPLEPOINT_DNA_SERVICE_CLIENT_SECRET: ${SIMPLEPOINT_DNA_SERVICE_CLIENT_SECRET:-dev-dna-service-secret}
    ports:
      - "2777:2777"
      - "15432:15432"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      authorization:
        condition: service_healthy
      common:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:2777/actuator/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  mcp-gateway:
    image: ${SIMPLEPOINT_MCP_GATEWAY_IMAGE:-somesimpled/open-simplepoint-mcp-gateway:${SIMPLEPOINT_IMAGE_TAG:-local}}
    restart: unless-stopped
    build:
      context: .
      dockerfile: simplepoint-services/simplepoint-service-mcp-gateway/Dockerfile
      args: *oci-build-args
    environment:
      SPRING_PROFILES_ACTIVE: dev,compose
      SIMPLEPOINT_WAIT_FOR: redis:6379,consul:8500,authorization:9000
      SIMPLEPOINT_WAIT_FOR_URLS: http://consul:8500/v1/kv/simplepoint/bootstrap/status?raw
      SIMPLEPOINT_WAIT_TIMEOUT: 240
      SIMPLEPOINT_MCP_GATEWAY_INTERNAL_TOKEN: ${SIMPLEPOINT_MCP_GATEWAY_INTERNAL_TOKEN:-dev-mcp-gateway-internal-token-change-me}
      SIMPLEPOINT_MCP_CAPABILITY_TOKEN_SIGNING_KEY: ${SIMPLEPOINT_MCP_CAPABILITY_TOKEN_SIGNING_KEY:-dev-mcp-capability-signing-key-change-me-32bytes}
      SIMPLEPOINT_MCP_CONTROL_PLANE_BASE_URL: http://ai:2888
      SIMPLEPOINT_MCP_PUBLICATION_ISSUER_URI: http://${SIMPLEPOINT_PUBLIC_HOST:-localhost}:9000
      SIMPLEPOINT_MCP_PUBLICATION_JWK_SET_URI: http://authorization:9000/oauth2/jwks
      SIMPLEPOINT_MCP_RUNTIME_MTLS_ENABLED: "true"
      SIMPLEPOINT_MCP_RUNTIME_MTLS_KEY_STORE: /run/simplepoint/runtime-pki/gateway/identity.p12
      SIMPLEPOINT_MCP_RUNTIME_MTLS_KEY_STORE_PASSWORD: ${SIMPLEPOINT_RUNTIME_PKI_STORE_PASSWORD:-dev-runtime-pki-password-change-me}
      SIMPLEPOINT_MCP_RUNTIME_MTLS_TRUST_STORE: /run/simplepoint/runtime-pki/gateway/trust.p12
      SIMPLEPOINT_MCP_RUNTIME_MTLS_TRUST_STORE_PASSWORD: ${SIMPLEPOINT_RUNTIME_PKI_STORE_PASSWORD:-dev-runtime-pki-password-change-me}
    volumes:
      - simplepoint_runtime_pki:/run/simplepoint/runtime-pki:ro
    expose:
      - "2890"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      runtime-pki:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:2890/actuator/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  runtime-pki:
    image: ${SIMPLEPOINT_RUNTIME_PKI_IMAGE:-somesimpled/open-simplepoint-runtime-pki:${SIMPLEPOINT_IMAGE_TAG:-local}}
    build:
      context: .
      dockerfile: docker/runtime-pki/Dockerfile
      args: *oci-build-args
    environment:
      SIMPLEPOINT_TOOL_RUNTIME_NODE_ID: ${SIMPLEPOINT_TOOL_RUNTIME_NODE_ID:-local-runtime-node}
      SIMPLEPOINT_RUNTIME_PKI_STORE_PASSWORD: ${SIMPLEPOINT_RUNTIME_PKI_STORE_PASSWORD:-dev-runtime-pki-password-change-me}
    volumes:
      - simplepoint_runtime_pki:/pki
    restart: "no"

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    restart: unless-stopped
    environment:
      ALLOW_START: "1"
      ALLOW_STOP: "1"
      CONTAINERS: "1"
      EVENTS: "0"
      IMAGES: "1"
      INFO: "1"
      POST: "1"
      VOLUMES: "1"
    read_only: true
    tmpfs:
      - /run
      - /tmp
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - runtime-engine

  tool-egress-proxy:
    image: ${SIMPLEPOINT_TOOL_EGRESS_PROXY_IMAGE:-somesimpled/open-simplepoint-tool-egress-proxy:${SIMPLEPOINT_IMAGE_TAG:-local}}
    restart: unless-stopped
    build:
      context: .
      dockerfile: simplepoint-services/simplepoint-service-tool-egress-proxy/Dockerfile
      args: *oci-build-args
    environment:
      SIMPLEPOINT_TOOL_EGRESS_SIGNING_KEY: ${SIMPLEPOINT_TOOL_EGRESS_SIGNING_KEY:-dev-tool-egress-signing-key-change-me}
      SIMPLEPOINT_TOOL_EGRESS_UPSTREAM_PROXY_URL: ${SIMPLEPOINT_TOOL_EGRESS_UPSTREAM_PROXY_URL:-}
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    expose:
      - "2892"
    networks:
      - default
      - runtime-egress
    healthcheck:
      test: ["CMD", "/tool-egress-proxy", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 5s

  tool-image-verifier:
    image: ${SIMPLEPOINT_TOOL_IMAGE_VERIFIER_IMAGE:-somesimpled/open-simplepoint-tool-image-verifier:${SIMPLEPOINT_IMAGE_TAG:-local}}
    restart: unless-stopped
    build:
      context: .
      dockerfile: simplepoint-services/simplepoint-service-tool-image-verifier/Dockerfile
      args: *oci-build-args
    environment:
      SIMPLEPOINT_TOOL_IMAGE_VERIFIER_MTLS_ENABLED: "true"
      SIMPLEPOINT_TOOL_IMAGE_VERIFIER_TLS_CERT_FILE: /run/simplepoint/runtime-pki/verifier/tls.crt
      SIMPLEPOINT_TOOL_IMAGE_VERIFIER_TLS_KEY_FILE: /run/simplepoint/runtime-pki/verifier/tls.key
      SIMPLEPOINT_TOOL_IMAGE_VERIFIER_TLS_CA_FILE: /run/simplepoint/runtime-pki/verifier/ca.crt
      SIMPLEPOINT_TOOL_IMAGE_VERIFIER_AI_IDENTITY: spiffe://open-simplepoint/ai-control-plane
      SIMPLEPOINT_TOOL_IMAGE_VERIFIER_SIGNATURE_MODE: ${SIMPLEPOINT_TOOL_IMAGE_VERIFIER_SIGNATURE_MODE:-keyless}
      SIMPLEPOINT_TOOL_IMAGE_VERIFIER_COSIGN_PUBLIC_KEY_FILE: ${SIMPLEPOINT_TOOL_IMAGE_VERIFIER_COSIGN_PUBLIC_KEY_FILE:-}
      SIMPLEPOINT_TOOL_IMAGE_VERIFIER_CERTIFICATE_IDENTITY_REGEXP: ${SIMPLEPOINT_TOOL_IMAGE_CERTIFICATE_IDENTITY_REGEXP:-^https://github.com/simplepoint1024/open-simplepoint-dashboard/.github/workflows/.+$}
      SIMPLEPOINT_TOOL_IMAGE_VERIFIER_CERTIFICATE_OIDC_ISSUER: ${SIMPLEPOINT_TOOL_IMAGE_CERTIFICATE_OIDC_ISSUER:-https://token.actions.githubusercontent.com}
      SIMPLEPOINT_TOOL_IMAGE_VERIFIER_ALLOW_HTTP_REGISTRY: ${SIMPLEPOINT_TOOL_IMAGE_VERIFIER_ALLOW_HTTP_REGISTRY:-false}
      SIMPLEPOINT_TOOL_IMAGE_VERIFIER_ALLOW_INSECURE_REGISTRY: ${SIMPLEPOINT_TOOL_IMAGE_VERIFIER_ALLOW_INSECURE_REGISTRY:-false}
      SIMPLEPOINT_TOOL_IMAGE_VERIFIER_IGNORE_TRANSPARENCY_LOG: ${SIMPLEPOINT_TOOL_IMAGE_VERIFIER_IGNORE_TRANSPARENCY_LOG:-false}
      SIMPLEPOINT_TOOL_IMAGE_VERIFIER_REQUIRE_SBOM: ${SIMPLEPOINT_TOOL_IMAGE_VERIFIER_REQUIRE_SBOM:-true}
      SIMPLEPOINT_TOOL_IMAGE_VERIFIER_BLOCKED_SEVERITIES: ${SIMPLEPOINT_TOOL_IMAGE_BLOCKED_SEVERITIES:-HIGH,CRITICAL}
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    volumes:
      - simplepoint_runtime_pki:/run/simplepoint/runtime-pki:ro
      - simplepoint_trivy_cache:/var/cache/trivy
    expose:
      - "2893"
    depends_on:
      runtime-pki:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/tool-image-verifier", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  tool-runtime:
    image: ${SIMPLEPOINT_TOOL_RUNTIME_IMAGE:-somesimpled/open-simplepoint-tool-runtime:${SIMPLEPOINT_IMAGE_TAG:-local}}
    restart: unless-stopped
    build:
      context: .
      dockerfile: simplepoint-services/simplepoint-service-tool-runtime-node/Dockerfile
      args: *oci-build-args
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      SIMPLEPOINT_TOOL_RUNTIME_NODE_ID: ${SIMPLEPOINT_TOOL_RUNTIME_NODE_ID:-local-runtime-node}
      SIMPLEPOINT_TOOL_RUNTIME_MTLS_ENABLED: "true"
      SIMPLEPOINT_TOOL_RUNTIME_TLS_CERT_FILE: /run/simplepoint/runtime-pki/node/tls.crt
      SIMPLEPOINT_TOOL_RUNTIME_TLS_KEY_FILE: /run/simplepoint/runtime-pki/node/tls.key
      SIMPLEPOINT_TOOL_RUNTIME_TLS_CA_FILE: /run/simplepoint/runtime-pki/node/ca.crt
      SIMPLEPOINT_TOOL_RUNTIME_TLS_SERVER_NAME: tool-runtime
      SIMPLEPOINT_TOOL_RUNTIME_TLS_CONTROL_SERVER_NAME: ai
      SIMPLEPOINT_TOOL_RUNTIME_CONTROL_PLANE_URL: https://ai:2889
      SIMPLEPOINT_TOOL_RUNTIME_ADVERTISE_URL: https://tool-runtime:2891
      SIMPLEPOINT_TOOL_RUNTIME_NODE_LABELS: ${SIMPLEPOINT_TOOL_RUNTIME_NODE_LABELS:-environment=local,orchestrator=compose}
      SIMPLEPOINT_TOOL_RUNTIME_MAX_WORKLOADS: ${SIMPLEPOINT_TOOL_RUNTIME_MAX_WORKLOADS:-64}
      SIMPLEPOINT_TOOL_RUNTIME_MAX_REPORTED_IMAGE_DIGESTS: ${SIMPLEPOINT_TOOL_RUNTIME_MAX_REPORTED_IMAGE_DIGESTS:-256}
      SIMPLEPOINT_TOOL_RUNTIME_ALLOWED_REGISTRIES: ${SIMPLEPOINT_TOOL_RUNTIME_ALLOWED_REGISTRIES:-docker.io,ghcr.io,mcr.microsoft.com}
      SIMPLEPOINT_TOOL_RUNTIME_REQUIRE_DIGEST: ${SIMPLEPOINT_TOOL_RUNTIME_REQUIRE_DIGEST:-true}
      SIMPLEPOINT_TOOL_RUNTIME_REQUIRE_MCP_LABELS: ${SIMPLEPOINT_TOOL_RUNTIME_REQUIRE_MCP_LABELS:-false}
      SIMPLEPOINT_TOOL_RUNTIME_ALLOW_BRIDGE_NETWORK: ${SIMPLEPOINT_TOOL_RUNTIME_ALLOW_BRIDGE_NETWORK:-false}
      SIMPLEPOINT_TOOL_RUNTIME_EGRESS_ENABLED: "true"
      SIMPLEPOINT_TOOL_RUNTIME_EGRESS_NETWORK: ${SIMPLEPOINT_RUNTIME_EGRESS_NETWORK:-open-simplepoint-runtime-egress}
      SIMPLEPOINT_TOOL_RUNTIME_EGRESS_PROXY_URL: http://tool-egress-proxy:2892
      SIMPLEPOINT_TOOL_RUNTIME_EGRESS_SIGNING_KEY: ${SIMPLEPOINT_TOOL_EGRESS_SIGNING_KEY:-dev-tool-egress-signing-key-change-me}
      SIMPLEPOINT_TOOL_RUNTIME_TRANSPORT_NETWORK: ${SIMPLEPOINT_RUNTIME_TRANSPORT_NETWORK:-open-simplepoint-runtime-transport}
      SIMPLEPOINT_TOOL_RUNTIME_INTERNAL_SERVICE_ROUTES: postgres:5432=${SIMPLEPOINT_RUNTIME_POSTGRES_NETWORK:-open-simplepoint-runtime-postgres}
      SIMPLEPOINT_TOOL_RUNTIME_SECRET_ROOT: /run/simplepoint/runtime-secrets
      SIMPLEPOINT_TOOL_RUNTIME_SECRET_VOLUME: ${SIMPLEPOINT_RUNTIME_SECRET_VOLUME:-open-simplepoint-dashboard_simplepoint_runtime_secrets}
      SIMPLEPOINT_TOOL_RUNTIME_SECRET_MOUNT_TARGET: /run/secrets/simplepoint
      SIMPLEPOINT_TOOL_RUNTIME_LAUNCHER_ENABLED: "true"
      SIMPLEPOINT_TOOL_RUNTIME_SUPPLY_CHAIN_ENABLED: ${SIMPLEPOINT_TOOL_RUNTIME_SUPPLY_CHAIN_ENABLED:-false}
      SIMPLEPOINT_TOOL_RUNTIME_IMAGE_VERIFIER_URL: https://tool-image-verifier:2893
      SIMPLEPOINT_TOOL_RUNTIME_IMAGE_VERIFIER_SERVER_NAME: tool-image-verifier
      SIMPLEPOINT_TOOL_RUNTIME_IMAGE_VERIFIER_IDENTITY: spiffe://open-simplepoint/tool-image-verifier
      SIMPLEPOINT_TOOL_RUNTIME_SECCOMP_PROFILE: /etc/simplepoint/runtime-security/seccomp.json
      SIMPLEPOINT_TOOL_RUNTIME_SECCOMP_REQUIRED: "true"
      SIMPLEPOINT_TOOL_RUNTIME_APPARMOR_PROFILE: open-simplepoint-mcp-workload
      SIMPLEPOINT_TOOL_RUNTIME_APPARMOR_ENABLED: ${SIMPLEPOINT_TOOL_RUNTIME_APPARMOR_ENABLED:-false}
      SIMPLEPOINT_TOOL_RUNTIME_APPARMOR_REQUIRED: ${SIMPLEPOINT_TOOL_RUNTIME_APPARMOR_REQUIRED:-false}
      SIMPLEPOINT_TOOL_RUNTIME_TLS_EXPECTED_GATEWAY_IDENTITY: spiffe://open-simplepoint/mcp-gateway
    volumes:
      - simplepoint_runtime_pki:/run/simplepoint/runtime-pki:ro
      - simplepoint_runtime_secrets:/run/simplepoint/runtime-secrets
      - ./docker/runtime-security/seccomp.json:/etc/simplepoint/runtime-security/seccomp.json:ro
    networks:
      - default
      - runtime-engine
      - runtime-transport
    depends_on:
      runtime-pki:
        condition: service_completed_successfully
      docker-socket-proxy:
        condition: service_started
      tool-egress-proxy:
        condition: service_healthy
      tool-image-verifier:
        condition: service_healthy
    ports:
      - "${SIMPLEPOINT_TOOL_RUNTIME_PORT:-2891}:2891"
    healthcheck:
      test: ["CMD", "/tool-runtime-node", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  ai:
    image: ${SIMPLEPOINT_AI_IMAGE:-somesimpled/open-simplepoint-ai:${SIMPLEPOINT_IMAGE_TAG:-local}}
    restart: unless-stopped
    build:
      context: .
      dockerfile: simplepoint-services/simplepoint-service-ai/Dockerfile
      args: *oci-build-args
    environment:
      SPRING_PROFILES_ACTIVE: dev,compose
      SIMPLEPOINT_SERVICE_AI_OPTS: "-XX:CompileCommand=exclude,org/springframework/web/util/UriComponentsBuilder.build"
      SIMPLEPOINT_WAIT_FOR: postgres:5432,redis:6379,consul:8500,authorization:9000,common:7000,mcp-gateway:2890
      SIMPLEPOINT_WAIT_FOR_URLS: http://consul:8500/v1/kv/simplepoint/bootstrap/status?raw
      SIMPLEPOINT_WAIT_TIMEOUT: 240
      SIMPLEPOINT_AI_SERVICE_CLIENT_SECRET: ${SIMPLEPOINT_AI_SERVICE_CLIENT_SECRET:-dev-ai-service-secret}
      SIMPLEPOINT_AI_CREDENTIAL_ENCRYPTION_KEY: ${SIMPLEPOINT_AI_CREDENTIAL_ENCRYPTION_KEY:-dev-ai-credential-encryption-key-change-me}
      SIMPLEPOINT_AI_API_KEY_HASH_PEPPER: ${SIMPLEPOINT_AI_API_KEY_HASH_PEPPER:-dev-ai-model-api-key-pepper-change-me}
      SIMPLEPOINT_AI_API_KEY_DEFAULT_RATE_LIMIT_PER_MINUTE: ${SIMPLEPOINT_AI_API_KEY_DEFAULT_RATE_LIMIT_PER_MINUTE:-60}
      SIMPLEPOINT_AI_TENANT_PROVIDER_MANAGEMENT_ENABLED: ${SIMPLEPOINT_AI_TENANT_PROVIDER_MANAGEMENT_ENABLED:-true}
      SIMPLEPOINT_AI_RUNTIME_MCP_SESSION_DIRECTORY_TTL: ${SIMPLEPOINT_AI_RUNTIME_MCP_SESSION_DIRECTORY_TTL:-10m}
      SIMPLEPOINT_AI_RUNTIME_MCP_FAILURE_QUARANTINE: ${SIMPLEPOINT_AI_RUNTIME_MCP_FAILURE_QUARANTINE:-10s}
      SIMPLEPOINT_MCP_GATEWAY_BASE_URL: http://mcp-gateway:2890
      SIMPLEPOINT_MCP_GATEWAY_INTERNAL_TOKEN: ${SIMPLEPOINT_MCP_GATEWAY_INTERNAL_TOKEN:-dev-mcp-gateway-internal-token-change-me}
      SIMPLEPOINT_MCP_CAPABILITY_TOKEN_SIGNING_KEY: ${SIMPLEPOINT_MCP_CAPABILITY_TOKEN_SIGNING_KEY:-dev-mcp-capability-signing-key-change-me-32bytes}
      SIMPLEPOINT_TOOL_RUNTIME_MTLS_ENABLED: "true"
      SIMPLEPOINT_TOOL_RUNTIME_MTLS_KEY_STORE: /run/simplepoint/runtime-pki/ai/identity.p12
      SIMPLEPOINT_TOOL_RUNTIME_MTLS_KEY_STORE_PASSWORD: ${SIMPLEPOINT_RUNTIME_PKI_STORE_PASSWORD:-dev-runtime-pki-password-change-me}
      SIMPLEPOINT_TOOL_RUNTIME_MTLS_TRUST_STORE: /run/simplepoint/runtime-pki/ai/trust.p12
      SIMPLEPOINT_TOOL_RUNTIME_MTLS_TRUST_STORE_PASSWORD: ${SIMPLEPOINT_RUNTIME_PKI_STORE_PASSWORD:-dev-runtime-pki-password-change-me}
      SIMPLEPOINT_AI_SKILL_ARTIFACT_ALLOWED_REGISTRIES: ${SIMPLEPOINT_AI_SKILL_ARTIFACT_ALLOWED_REGISTRIES:-docker.io,ghcr.io,registry:5000}
      SIMPLEPOINT_AI_SKILL_ARTIFACT_INSECURE_REGISTRIES: ${SIMPLEPOINT_AI_SKILL_ARTIFACT_INSECURE_REGISTRIES:-registry:5000}
      SIMPLEPOINT_AI_SKILL_ARTIFACT_ALLOWED_TOKEN_HOSTS: ${SIMPLEPOINT_AI_SKILL_ARTIFACT_ALLOWED_TOKEN_HOSTS:-auth.docker.io,ghcr.io,registry:5000}
      SIMPLEPOINT_AI_SKILL_ARTIFACT_SIGNATURE_REQUIRED: ${SIMPLEPOINT_AI_SKILL_ARTIFACT_SIGNATURE_REQUIRED:-true}
      SIMPLEPOINT_AI_SKILL_ARTIFACT_VERIFIER_URL: https://tool-image-verifier:2893
      SIMPLEPOINT_AI_SKILL_ARTIFACT_VERIFIER_MTLS_ENABLED: "true"
      SIMPLEPOINT_AI_MCP_PUBLICATION_BASE_URL: http://${SIMPLEPOINT_PUBLIC_HOST:-localhost}:8080
      SIMPLEPOINT_AI_MCP_PUBLICATION_AUTHORIZATION_SERVER_URL: http://${SIMPLEPOINT_PUBLIC_HOST:-localhost}:9000
      SIMPLEPOINT_AI_MCP_PUBLICATION_ALLOW_INSECURE_HTTP: "true"
    ports:
      - "2888:2888"
    expose:
      - "2889"
    volumes:
      - simplepoint_runtime_pki:/run/simplepoint/runtime-pki:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      authorization:
        condition: service_healthy
      common:
        condition: service_healthy
      mcp-gateway:
        condition: service_healthy
      runtime-pki:
        condition: service_completed_successfully
      tool-image-verifier:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:2888/actuator/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  agent-runtime:
    image: ${SIMPLEPOINT_AGENT_RUNTIME_IMAGE:-somesimpled/open-simplepoint-agent-runtime:${SIMPLEPOINT_IMAGE_TAG:-local}}
    restart: unless-stopped
    build:
      context: .
      dockerfile: simplepoint-services/simplepoint-service-agent-runtime/Dockerfile
      args: *oci-build-args
    environment:
      SPRING_PROFILES_ACTIVE: dev,compose
      SIMPLEPOINT_WAIT_FOR: postgres:5432,consul:8500,ai:2888
      SIMPLEPOINT_WAIT_FOR_URLS: http://consul:8500/v1/kv/simplepoint/bootstrap/status?raw
      SIMPLEPOINT_WAIT_TIMEOUT: 240
      SIMPLEPOINT_AI_CREDENTIAL_ENCRYPTION_KEY: ${SIMPLEPOINT_AI_CREDENTIAL_ENCRYPTION_KEY:-dev-ai-credential-encryption-key-change-me}
      SIMPLEPOINT_AI_TENANT_PROVIDER_MANAGEMENT_ENABLED: ${SIMPLEPOINT_AI_TENANT_PROVIDER_MANAGEMENT_ENABLED:-true}
      SIMPLEPOINT_AI_AGENT_EXECUTION_ENABLED: "true"
      SIMPLEPOINT_AI_AGENT_EXECUTION_BATCH_SIZE: ${SIMPLEPOINT_AI_AGENT_EXECUTION_BATCH_SIZE:-4}
      SIMPLEPOINT_AI_AGENT_EXECUTION_MAXIMUM_CONCURRENCY: ${SIMPLEPOINT_AI_AGENT_EXECUTION_MAXIMUM_CONCURRENCY:-8}
      SIMPLEPOINT_AI_AGENT_EXECUTION_LEASE_DURATION: ${SIMPLEPOINT_AI_AGENT_EXECUTION_LEASE_DURATION:-2m}
      SIMPLEPOINT_AI_AGENT_EXECUTION_LEASE_HEARTBEAT_INTERVAL: ${SIMPLEPOINT_AI_AGENT_EXECUTION_LEASE_HEARTBEAT_INTERVAL:-20s}
      SIMPLEPOINT_AI_AGENT_EXECUTION_SHUTDOWN_TIMEOUT: ${SIMPLEPOINT_AI_AGENT_EXECUTION_SHUTDOWN_TIMEOUT:-30s}
    expose:
      - "2894"
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:2894/actuator/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s

  workflow-runtime:
    image: ${SIMPLEPOINT_WORKFLOW_RUNTIME_IMAGE:-somesimpled/open-simplepoint-workflow-runtime:${SIMPLEPOINT_IMAGE_TAG:-local}}
    restart: unless-stopped
    build:
      context: .
      dockerfile: simplepoint-services/simplepoint-service-workflow-runtime/Dockerfile
      args: *oci-build-args
    environment:
      SPRING_PROFILES_ACTIVE: dev,compose
      SIMPLEPOINT_WAIT_FOR: postgres:5432,consul:8500,ai:2888
      SIMPLEPOINT_WAIT_FOR_URLS: http://consul:8500/v1/kv/simplepoint/bootstrap/status?raw
      SIMPLEPOINT_WAIT_TIMEOUT: 240
      SIMPLEPOINT_AI_CREDENTIAL_ENCRYPTION_KEY: ${SIMPLEPOINT_AI_CREDENTIAL_ENCRYPTION_KEY:-dev-ai-credential-encryption-key-change-me}
      SIMPLEPOINT_AI_TENANT_PROVIDER_MANAGEMENT_ENABLED: ${SIMPLEPOINT_AI_TENANT_PROVIDER_MANAGEMENT_ENABLED:-true}
      SIMPLEPOINT_AI_WORKFLOW_EXECUTION_ENABLED: "true"
      SIMPLEPOINT_AI_WORKFLOW_EXECUTION_BATCH_SIZE: ${SIMPLEPOINT_AI_WORKFLOW_EXECUTION_BATCH_SIZE:-4}
      SIMPLEPOINT_AI_WORKFLOW_EXECUTION_MAXIMUM_CONCURRENCY: ${SIMPLEPOINT_AI_WORKFLOW_EXECUTION_MAXIMUM_CONCURRENCY:-8}
      SIMPLEPOINT_AI_WORKFLOW_EXECUTION_LEASE_DURATION: ${SIMPLEPOINT_AI_WORKFLOW_EXECUTION_LEASE_DURATION:-2m}
      SIMPLEPOINT_AI_WORKFLOW_EXECUTION_LEASE_HEARTBEAT_INTERVAL: ${SIMPLEPOINT_AI_WORKFLOW_EXECUTION_LEASE_HEARTBEAT_INTERVAL:-20s}
      SIMPLEPOINT_AI_WORKFLOW_EXECUTION_SHUTDOWN_TIMEOUT: ${SIMPLEPOINT_AI_WORKFLOW_EXECUTION_SHUTDOWN_TIMEOUT:-30s}
    expose:
      - "2895"
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:2895/actuator/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s

  host:
    image: ${SIMPLEPOINT_HOST_IMAGE:-somesimpled/open-simplepoint-host:${SIMPLEPOINT_IMAGE_TAG:-local}}
    restart: unless-stopped
    build:
      context: .
      dockerfile: simplepoint-services/simplepoint-service-host/Dockerfile
      args: *oci-build-args
    environment:
      SPRING_PROFILES_ACTIVE: dev,compose
      SIMPLEPOINT_WAIT_FOR: redis:6379,consul:8500
      SIMPLEPOINT_WAIT_FOR_URLS: http://consul:8500/v1/kv/simplepoint/bootstrap/status?raw
      SIMPLEPOINT_WAIT_TIMEOUT: 240
      SIMPLEPOINT_HOST_SERVICE_CLIENT_SECRET: ${SIMPLEPOINT_HOST_SERVICE_CLIENT_SECRET:-dev-host-service-secret}
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      authorization:
        condition: service_healthy
      common:
        condition: service_healthy
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  simplepoint_postgres_data:
    name: ${SIMPLEPOINT_POSTGRES_VOLUME:-open-simplepoint-dashboard_simplepoint_postgres_data}
  simplepoint_redis_data:
    name: ${SIMPLEPOINT_REDIS_VOLUME:-open-simplepoint-dashboard_simplepoint_redis_data}
  simplepoint_minio_data:
    name: ${SIMPLEPOINT_MINIO_VOLUME:-open-simplepoint-dashboard_simplepoint_minio_data}
  simplepoint_runtime_pki:
    name: ${SIMPLEPOINT_RUNTIME_PKI_VOLUME:-open-simplepoint-dashboard_simplepoint_runtime_pki}
  simplepoint_runtime_secrets:
    name: ${SIMPLEPOINT_RUNTIME_SECRET_VOLUME:-open-simplepoint-dashboard_simplepoint_runtime_secrets}
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=16m,uid=65532,gid=65532,mode=0700
  simplepoint_trivy_cache:
    name: ${SIMPLEPOINT_TRIVY_CACHE_VOLUME:-open-simplepoint-dashboard_simplepoint_trivy_cache}

networks:
  runtime-engine:
    internal: true
  runtime-egress:
    name: ${SIMPLEPOINT_RUNTIME_EGRESS_NETWORK:-open-simplepoint-runtime-egress}
    internal: true
  runtime-transport:
    name: ${SIMPLEPOINT_RUNTIME_TRANSPORT_NETWORK:-open-simplepoint-runtime-transport}
    internal: true
  runtime-postgres:
    name: ${SIMPLEPOINT_RUNTIME_POSTGRES_NETWORK:-open-simplepoint-runtime-postgres}
    internal: true
