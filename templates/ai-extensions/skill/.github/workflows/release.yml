name: verify-and-publish-skill

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write
  id-token: write

env:
  ARTIFACT: ghcr.io/${{ github.repository_owner }}/__EXTENSION_NAME__

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: oras-project/setup-oras@v1
      - uses: sigstore/cosign-installer@v3
      - run: npm ci
      - env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${REGISTRY_TOKEN}" \
            | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
      - env:
          OCI_REFERENCE: ${{ env.ARTIFACT }}:${{ github.ref_name }}
          OCI_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          OCI_REVISION: ${{ github.sha }}
          OCI_VERSION: ${{ github.ref_name }}
        run: npm run package
      - env:
          OCI_REFERENCE: ${{ env.ARTIFACT }}:${{ github.ref_name }}
          COSIGN_EXPERIMENTAL: '1'
        run: |
          digest="$(oras manifest fetch --descriptor "${OCI_REFERENCE}" \
            | jq -er '.digest')"
          cosign sign --yes "${ARTIFACT}@${digest}"
