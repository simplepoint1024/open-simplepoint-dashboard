simplepoint.datasource.default-name=postgres
simplepoint.datasource.list[0].name=postgres
simplepoint.datasource.list[0].url=jdbc:postgresql://postgres:5432/simplepoint
simplepoint.datasource.list[0].username=postgres
simplepoint.datasource.list[0].password=postgres
simplepoint.datasource.list[0].driver-class-name=org.postgresql.Driver

spring.data.redis.host=redis
spring.data.redis.port=6379

simplepoint.service-router.internal-auth.mode=oauth2
simplepoint.service-router.internal-auth.oauth2.token-uri=http://authorization:9000/oauth2/token
simplepoint.service-router.internal-auth.oauth2.scopes[0]=service-router.invoke
simplepoint.service-router.internal-auth.oauth2.required-authority=SCOPE_service-router.invoke
