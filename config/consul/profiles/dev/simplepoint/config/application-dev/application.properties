server.host=${SERVER_HOST:127.0.0.1}
server.public-scheme=${SERVER_PUBLIC_SCHEME:http}
server.public-host=${SERVER_PUBLIC_HOST:127.0.0.1}
server.oauth2.issuer-uri=${SERVER_OAUTH2_ISSUER_URI:http://${server.public-host}:9000}
server.oauth2.client.base-uri=${SERVER_OAUTH2_CLIENT_BASE_URI:${server.public-scheme}://${server.public-host}:8080}

simplepoint.datasource.default-name=postgres
simplepoint.datasource.list[0].name=postgres
simplepoint.datasource.list[0].url=jdbc:postgresql://${SIMPLEPOINT_POSTGRES_HOST:127.0.0.1}:${SIMPLEPOINT_POSTGRES_PORT:5432}/${SIMPLEPOINT_POSTGRES_DATABASE:simplepoint}
simplepoint.datasource.list[0].username=${SIMPLEPOINT_POSTGRES_USERNAME:postgres}
simplepoint.datasource.list[0].password=${SIMPLEPOINT_POSTGRES_PASSWORD:postgres}
simplepoint.datasource.list[0].driver-class-name=org.postgresql.Driver

spring.data.redis.host=${SIMPLEPOINT_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${SIMPLEPOINT_REDIS_PORT:6379}
spring.data.redis.password=${SIMPLEPOINT_REDIS_PASSWORD:}

simplepoint.service-router.internal-auth.mode=oauth2
simplepoint.service-router.internal-auth.oauth2.token-uri=${server.oauth2.issuer-uri}/oauth2/token
simplepoint.service-router.internal-auth.oauth2.client-id=${SIMPLEPOINT_SERVICE_CLIENT_ID:simplepoint-service-dev}
simplepoint.service-router.internal-auth.oauth2.client-secret=${SIMPLEPOINT_SERVICE_CLIENT_SECRET:dev-service-secret}
simplepoint.service-router.internal-auth.oauth2.scopes[0]=service-router.invoke
simplepoint.service-router.internal-auth.oauth2.required-authority=SCOPE_service-router.invoke

spring.security.oauth2.resourceserver.jwt.issuer-uri=${server.oauth2.issuer-uri}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${server.oauth2.issuer-uri}/oauth2/jwks
spring.security.oauth2.resourceserver.jwt.jws-algorithms[0]=PS256
simplepoint.security.oauth2.user-info-uri=${server.oauth2.issuer-uri}/userinfo

spring.security.oauth2.client.provider.simplepoint.authorization-uri=${server.oauth2.issuer-uri}/oauth2/authorize
spring.security.oauth2.client.provider.simplepoint.token-uri=${server.oauth2.issuer-uri}/oauth2/token
spring.security.oauth2.client.provider.simplepoint.jwk-set-uri=${server.oauth2.issuer-uri}/oauth2/jwks
spring.security.oauth2.client.provider.simplepoint.user-info-uri=${server.oauth2.issuer-uri}/userinfo
spring.security.oauth2.client.provider.simplepoint.user-name-attribute=sub

spring.security.oauth2.client.registration.simplepoint-client.client-name=simplepoint-client
spring.security.oauth2.client.registration.simplepoint-client.client-id=simplepoint-client
spring.security.oauth2.client.registration.simplepoint-client.client-secret=secret
spring.security.oauth2.client.registration.simplepoint-client.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.simplepoint-client.scope[0]=openid
spring.security.oauth2.client.registration.simplepoint-client.scope[1]=profile
spring.security.oauth2.client.registration.simplepoint-client.scope[2]=roles
spring.security.oauth2.client.registration.simplepoint-client.scope[3]=tenant
spring.security.oauth2.client.registration.simplepoint-client.scope[4]=organs
spring.security.oauth2.client.registration.simplepoint-client.scope[5]=email
spring.security.oauth2.client.registration.simplepoint-client.scope[6]=address
spring.security.oauth2.client.registration.simplepoint-client.scope[7]=phone
spring.security.oauth2.client.registration.simplepoint-client.scope[8]=mcp.invoke
spring.security.oauth2.client.registration.simplepoint-client.redirect-uri=${server.oauth2.client.base-uri}/login/oauth2/code/oidc
spring.security.oauth2.client.registration.simplepoint-client.post-logout-redirect-uris[0]=${server.oauth2.client.base-uri}
spring.security.oauth2.client.registration.simplepoint-client.provider=simplepoint
spring.security.oauth2.client.registration.simplepoint-client.require-authorization-consent=false
spring.security.oauth2.client.registration.simplepoint-client.access-token-time-to-live=30m
spring.security.oauth2.client.registration.simplepoint-client.refresh-token-time-to-live=8h

spring.security.oauth2.client.registration.simplepoint-service-dev.client-name=SimplePoint Dev Service
spring.security.oauth2.client.registration.simplepoint-service-dev.client-id=simplepoint-service-dev
spring.security.oauth2.client.registration.simplepoint-service-dev.client-secret=${SIMPLEPOINT_SERVICE_CLIENT_SECRET:dev-service-secret}
spring.security.oauth2.client.registration.simplepoint-service-dev.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.simplepoint-service-dev.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.simplepoint-service-dev.scope[0]=service-router.invoke
spring.security.oauth2.client.registration.simplepoint-service-dev.provider=simplepoint
