server.port=2890
spring.cloud.consul.discovery.health-check-url=http://127.0.0.1:${server.port}${spring.cloud.consul.discovery.health-check-path}
simplepoint.mcp.gateway.control-plane-base-url=http://127.0.0.1:2888
simplepoint.mcp.gateway.publication-issuer-uri=${server.oauth2.issuer-uri}
simplepoint.mcp.gateway.publication-jwk-set-uri=${server.oauth2.issuer-uri}/oauth2/jwks
simplepoint.mcp.gateway.allow-insecure-oauth-endpoints=true
