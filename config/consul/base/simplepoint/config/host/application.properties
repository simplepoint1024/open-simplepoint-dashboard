spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true
spring.cloud.gateway.server.webflux.default-filters[0]=SaveSession
spring.cloud.gateway.server.webflux.default-filters[1]=TokenRelay

spring.cloud.gateway.server.webflux.routes[0].id=userinfo-proxy
spring.cloud.gateway.server.webflux.routes[0].uri=lb://authorization
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/userinfo
spring.cloud.gateway.server.webflux.routes[0].filters[0]=RemoveRequestHeader=Cookie
spring.cloud.gateway.server.webflux.routes[0].filters[1]=RewritePath=/userinfo, /userinfo
spring.cloud.gateway.server.webflux.routes[0].filters[2]=PreserveHostHeader

spring.cloud.gateway.server.webflux.routes[1].id=mcp-publications
spring.cloud.gateway.server.webflux.routes[1].uri=lb://mcp-gateway
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/mcp/**,/.well-known/oauth-protected-resource/**,/.well-known/oauth-client/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=RemoveRequestHeader=Cookie
spring.cloud.gateway.server.webflux.routes[1].filters[1]=PreserveHostHeader

# Stable authorization UI/account route. Do not rely on discovery-locator cache for browser flows.
spring.cloud.gateway.server.webflux.routes[2].id=authorization-ui
spring.cloud.gateway.server.webflux.routes[2].uri=lb://authorization
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/authorization/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[2].filters[1]=SetRequestHeader=X-Forwarded-Prefix, /authorization
spring.cloud.gateway.server.webflux.routes[2].filters[2]=PreserveHostHeader

# Stable AI workbench/API route. Keep the route definition while the AI
# service is rolling so recovery never depends on a Host restart.
spring.cloud.gateway.server.webflux.routes[3].id=ai-api
spring.cloud.gateway.server.webflux.routes[3].uri=lb://ai
spring.cloud.gateway.server.webflux.routes[3].order=-100
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/ai/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=1

simplepoint.host.mcp-session-affinity.enabled=${SIMPLEPOINT_MCP_SESSION_AFFINITY_ENABLED:true}
simplepoint.host.mcp-session-affinity.ttl=${SIMPLEPOINT_MCP_SESSION_AFFINITY_TTL:10m}
simplepoint.host.mcp-session-affinity.key-prefix=${SIMPLEPOINT_MCP_SESSION_AFFINITY_KEY_PREFIX:simplepoint:mcp:sessions:}
