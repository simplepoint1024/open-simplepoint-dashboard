server.port=6000
spring.application.name=auditing
# Durable audit is mandatory: provision database schema and broker topology before startup.
simplepoint.events.enabled=true
simplepoint.events.service=auditing
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
spring.cloud.consul.discovery.health-check-path=/actuator/health/readiness
