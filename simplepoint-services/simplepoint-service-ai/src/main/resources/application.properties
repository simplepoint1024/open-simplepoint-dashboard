simplepoint.ai.skill.artifact.verifier-mtls-enabled=${SIMPLEPOINT_AI_SKILL_ARTIFACT_VERIFIER_MTLS_ENABLED:${SIMPLEPOINT_TOOL_RUNTIME_MTLS_ENABLED:false}}
