server.port=2888
spring.application.name=ai
management.endpoints.web.exposure.include=health,info,metrics
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=22MB

simplepoint.ai.catalog.official-sync-enabled=${AI_CATALOG_OFFICIAL_SYNC_ENABLED:true}
simplepoint.ai.catalog.scheduled-sync-enabled=${AI_CATALOG_SCHEDULED_SYNC_ENABLED:false}
simplepoint.ai.catalog.official-registry-url=${AI_CATALOG_OFFICIAL_REGISTRY_URL:https://registry.modelcontextprotocol.io}

simplepoint.ai.knowledge.max-upload-bytes=20971520
simplepoint.ai.knowledge.max-extracted-characters=5000000
simplepoint.ai.knowledge.embedding-batch-size=64
simplepoint.ai.knowledge.stored-vector-dimensions=2000
simplepoint.ai.knowledge.index-execution-enabled=${SIMPLEPOINT_AI_KNOWLEDGE_INDEX_EXECUTION_ENABLED:true}
simplepoint.ai.polling.adaptive-backoff-enabled=${SIMPLEPOINT_AI_ADAPTIVE_POLLING_ENABLED:true}
simplepoint.ai.polling.maximum-idle-interval=${SIMPLEPOINT_AI_POLLING_MAXIMUM_IDLE_INTERVAL:2s}
simplepoint.ai.api-key-hash-pepper=${SIMPLEPOINT_AI_API_KEY_HASH_PEPPER:${SIMPLEPOINT_AI_CREDENTIAL_ENCRYPTION_KEY:}}
simplepoint.ai.api-key-default-rate-limit-per-minute=${SIMPLEPOINT_AI_API_KEY_DEFAULT_RATE_LIMIT_PER_MINUTE:60}
simplepoint.ai.mcp.gateway-base-url=${SIMPLEPOINT_MCP_GATEWAY_BASE_URL:http://mcp-gateway:2890}
simplepoint.ai.mcp.gateway-internal-header=${SIMPLEPOINT_MCP_GATEWAY_INTERNAL_HEADER:X-SimplePoint-MCP-Gateway-Token}
simplepoint.ai.mcp.gateway-internal-token=${SIMPLEPOINT_MCP_GATEWAY_INTERNAL_TOKEN:}
simplepoint.ai.mcp.gateway-request-timeout=${SIMPLEPOINT_MCP_GATEWAY_REQUEST_TIMEOUT:45s}
simplepoint.ai.mcp.task-execution-enabled=${SIMPLEPOINT_MCP_TASK_EXECUTION_ENABLED:true}
simplepoint.ai.mcp.task-default-ttl=${SIMPLEPOINT_MCP_TASK_DEFAULT_TTL:1h}
simplepoint.ai.mcp.task-maximum-ttl=${SIMPLEPOINT_MCP_TASK_MAXIMUM_TTL:24h}
simplepoint.ai.mcp.task-poll-interval=${SIMPLEPOINT_MCP_TASK_POLL_INTERVAL:1s}
simplepoint.ai.mcp.task-worker-poll-interval=${SIMPLEPOINT_MCP_TASK_WORKER_POLL_INTERVAL:500ms}
simplepoint.ai.mcp.task-lease-duration=${SIMPLEPOINT_MCP_TASK_LEASE_DURATION:2m}
simplepoint.ai.mcp.task-worker-batch-size=${SIMPLEPOINT_MCP_TASK_WORKER_BATCH_SIZE:4}
simplepoint.ai.mcp.task-maximum-concurrency=${SIMPLEPOINT_MCP_TASK_MAXIMUM_CONCURRENCY:8}
simplepoint.ai.mcp.task-maximum-attempts=${SIMPLEPOINT_MCP_TASK_MAXIMUM_ATTEMPTS:3}
simplepoint.ai.mcp.task-maximum-payload-bytes=${SIMPLEPOINT_MCP_TASK_MAXIMUM_PAYLOAD_BYTES:1048576}
simplepoint.ai.runtime.control-internal-header=${SIMPLEPOINT_TOOL_RUNTIME_CONTROL_HEADER:X-SimplePoint-Tool-Runtime-Control-Token}
simplepoint.ai.runtime.control-internal-token=${SIMPLEPOINT_TOOL_RUNTIME_CONTROL_TOKEN:}
simplepoint.ai.runtime.heartbeat-interval=${SIMPLEPOINT_TOOL_RUNTIME_HEARTBEAT_INTERVAL:10s}
simplepoint.ai.runtime.heartbeat-timeout=${SIMPLEPOINT_TOOL_RUNTIME_HEARTBEAT_TIMEOUT:35s}
simplepoint.ai.runtime.stale-scan-interval=${SIMPLEPOINT_TOOL_RUNTIME_STALE_SCAN_INTERVAL:10s}
simplepoint.ai.runtime.scheduling-enabled=${SIMPLEPOINT_TOOL_RUNTIME_SCHEDULING_ENABLED:true}
simplepoint.ai.runtime.dispatch-internal-header=${SIMPLEPOINT_TOOL_RUNTIME_INTERNAL_HEADER:X-SimplePoint-Runtime-Token}
simplepoint.ai.runtime.dispatch-internal-token=${SIMPLEPOINT_TOOL_RUNTIME_INTERNAL_TOKEN:}
simplepoint.ai.runtime.mtls-enabled=${SIMPLEPOINT_TOOL_RUNTIME_MTLS_ENABLED:false}
simplepoint.ai.runtime.mtls-control-port=${SIMPLEPOINT_TOOL_RUNTIME_MTLS_CONTROL_PORT:2889}
simplepoint.ai.runtime.mtls-key-store=${SIMPLEPOINT_TOOL_RUNTIME_MTLS_KEY_STORE:}
simplepoint.ai.runtime.mtls-key-store-password=${SIMPLEPOINT_TOOL_RUNTIME_MTLS_KEY_STORE_PASSWORD:}
simplepoint.ai.runtime.mtls-trust-store=${SIMPLEPOINT_TOOL_RUNTIME_MTLS_TRUST_STORE:}
simplepoint.ai.runtime.mtls-trust-store-password=${SIMPLEPOINT_TOOL_RUNTIME_MTLS_TRUST_STORE_PASSWORD:}
simplepoint.ai.runtime.mtls-node-identity-prefix=${SIMPLEPOINT_TOOL_RUNTIME_MTLS_NODE_IDENTITY_PREFIX:spiffe://open-simplepoint/runtime-node/}
simplepoint.ai.runtime.dispatch-timeout=${SIMPLEPOINT_TOOL_RUNTIME_DISPATCH_TIMEOUT:30s}
simplepoint.ai.runtime.workload-lease-duration=${SIMPLEPOINT_TOOL_RUNTIME_WORKLOAD_LEASE_DURATION:45s}
simplepoint.ai.runtime.workload-dispatch-retry-interval=${SIMPLEPOINT_TOOL_RUNTIME_DISPATCH_RETRY_INTERVAL:5s}
simplepoint.ai.runtime.workload-observation-interval=${SIMPLEPOINT_TOOL_RUNTIME_OBSERVATION_INTERVAL:5s}
simplepoint.ai.runtime.workload-scheduler-interval=${SIMPLEPOINT_TOOL_RUNTIME_SCHEDULER_INTERVAL:1s}
simplepoint.ai.runtime.workload-scheduler-batch-size=${SIMPLEPOINT_TOOL_RUNTIME_SCHEDULER_BATCH_SIZE:16}
simplepoint.ai.runtime.pool-scheduler-interval=${SIMPLEPOINT_TOOL_RUNTIME_POOL_SCHEDULER_INTERVAL:2s}
simplepoint.ai.runtime.pool-scheduler-batch-size=${SIMPLEPOINT_TOOL_RUNTIME_POOL_SCHEDULER_BATCH_SIZE:16}
simplepoint.ai.runtime.pool-prewarm-retry-interval=${SIMPLEPOINT_TOOL_RUNTIME_POOL_PREWARM_RETRY_INTERVAL:30s}
simplepoint.ai.runtime.mcp-activation-timeout=${SIMPLEPOINT_AI_RUNTIME_MCP_ACTIVATION_TIMEOUT:30s}
simplepoint.ai.runtime.mcp-session-directory-ttl=${SIMPLEPOINT_AI_RUNTIME_MCP_SESSION_DIRECTORY_TTL:10m}
simplepoint.ai.runtime.mcp-failure-quarantine=${SIMPLEPOINT_AI_RUNTIME_MCP_FAILURE_QUARANTINE:10s}
simplepoint.ai.runtime.mcp-session-directory-key-prefix=${SIMPLEPOINT_AI_RUNTIME_MCP_SESSION_DIRECTORY_KEY_PREFIX:simplepoint:ai:runtime:mcp:sessions:}
simplepoint.ai.runtime.mcp-session-id-max-length=${SIMPLEPOINT_AI_RUNTIME_MCP_SESSION_ID_MAX_LENGTH:512}
simplepoint.storage.remote.service-name=${SIMPLEPOINT_STORAGE_REMOTE_SERVICE_NAME:common}
simplepoint.service-router.http.connect-timeout=3s
simplepoint.service-router.http.read-timeout=30s
