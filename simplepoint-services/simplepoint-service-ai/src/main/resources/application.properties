simplepoint.ai.skill.artifact.verifier-key-store-password=${SIMPLEPOINT_AI_SKILL_ARTIFACT_VERIFIER_KEY_STORE_PASSWORD:${SIMPLEPOINT_TOOL_RUNTIME_MTLS_KEY_STORE_PASSWORD:}}
simplepoint.ai.skill.artifact.verifier-trust-store=${SIMPLEPOINT_AI_SKILL_ARTIFACT_VERIFIER_TRUST_STORE:${SIMPLEPOINT_TOOL_RUNTIME_MTLS_TRUST_STORE:}}
simplepoint.ai.skill.artifact.verifier-trust-store-password=${SIMPLEPOINT_AI_SKILL_ARTIFACT_VERIFIER_TRUST_STORE_PASSWORD:${SIMPLEPOINT_TOOL_RUNTIME_MTLS_TRUST_STORE_PASSWORD:}}
