simplepoint.ai.mcp.gateway-base-url=${SIMPLEPOINT_MCP_GATEWAY_BASE_URL:http://mcp-gateway:2890}
simplepoint.ai.mcp.gateway-internal-header=${SIMPLEPOINT_MCP_GATEWAY_INTERNAL_HEADER:X-SimplePoint-MCP-Gateway-Token}
