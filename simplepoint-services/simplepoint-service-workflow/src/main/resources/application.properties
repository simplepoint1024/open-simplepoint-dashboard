server.port=2666
spring.application.name=workflow
spring.sql.init.mode=always
# Legacy host initialization remains explicit until the module migration installer is adopted.
spring.sql.init.schema-locations=classpath:META-INF/simplepoint/modules/workflow/db/legacy.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SIMPLEPOINT_JPA_SHOW_SQL:false}
management.endpoints.web.exposure.include=health,info,metrics

# Schema creation/upgrades must be an explicit deployment decision. Local compose enables
# bootstrap for a fresh database; managed environments keep this disabled after provisioning.
flowable.database-schema-update=${SIMPLEPOINT_FLOWABLE_SCHEMA_UPDATE:false}
flowable.check-process-definitions=false
flowable.history-level=audit
flowable.async-executor-activate=true

# Explicit APP integration, bounded by signed OAuth client identity and invocation scope.
simplepoint.service-router.routes[app.form-workflow:1]=app
simplepoint.workflow.business-remote.allowed-callers[0]=${SIMPLEPOINT_WORKFLOW_APP_CALLER:simplepoint-service-app}
simplepoint.service-router.http.read-timeout=65s

# Pre-provision the workflow broker identity and durable subscriptions before enabling this host.
simplepoint.events.enabled=true
simplepoint.events.service=workflow
simplepoint.events.declare-topology=false
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
spring.cloud.consul.discovery.health-check-path=/actuator/health/readiness
