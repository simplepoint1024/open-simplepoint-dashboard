server.port=2666
spring.application.name=workflow
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SIMPLEPOINT_JPA_SHOW_SQL:false}
management.endpoints.web.exposure.include=health,info,metrics

# Schema creation/upgrades must be an explicit deployment decision. Local compose enables
# bootstrap for a fresh database; managed environments keep this disabled after provisioning.
flowable.database-schema-update=${SIMPLEPOINT_FLOWABLE_SCHEMA_UPDATE:false}
flowable.check-process-definitions=false
flowable.history-level=audit
flowable.async-executor-activate=true

# Explicit APP integration, bounded by signed OAuth client identity and invocation scope.
simplepoint.service-router.routes[app.form-workflow:1]=app
simplepoint.workflow.business-remote.allowed-callers[0]=${SIMPLEPOINT_WORKFLOW_APP_CALLER:simplepoint-service-app}
simplepoint.service-router.http.read-timeout=65s
