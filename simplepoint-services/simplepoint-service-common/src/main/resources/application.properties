server.port=2666
spring.application.name=common

# Allow the 5 MB image / 10 MB attachment widgets, with bounded multipart overhead.
# Keep request size above file size and below the ingress limit (256 MB).
spring.servlet.multipart.max-file-size=${SIMPLEPOINT_UPLOAD_MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${SIMPLEPOINT_UPLOAD_MAX_REQUEST_SIZE:22MB}
simplepoint.storage.credential-encryption-key=${SIMPLEPOINT_STORAGE_CREDENTIAL_ENCRYPTION_KEY:dev-storage-credential-encryption-key-change-me}
simplepoint.security.oauth2.external-provider.credential-encryption-key=${SIMPLEPOINT_OAUTH2_EXTERNAL_PROVIDER_CREDENTIAL_ENCRYPTION_KEY:dev-oauth2-provider-key-change-me}
simplepoint.storage.bootstrap.minio.enabled=${SIMPLEPOINT_STORAGE_BOOTSTRAP_MINIO_ENABLED:false}
simplepoint.storage.bootstrap.minio.endpoint=${SIMPLEPOINT_STORAGE_BOOTSTRAP_MINIO_ENDPOINT:http://minio:9000}
simplepoint.storage.bootstrap.minio.access-key=${SIMPLEPOINT_MINIO_ROOT_USER:}
simplepoint.storage.bootstrap.minio.secret-key=${SIMPLEPOINT_MINIO_ROOT_PASSWORD:}
simplepoint.storage.bootstrap.minio.bucket=${SIMPLEPOINT_MINIO_BUCKET:simplepoint}
simplepoint.storage.bootstrap.minio.default-provider=${SIMPLEPOINT_STORAGE_BOOTSTRAP_MINIO_DEFAULT_PROVIDER:true}

# Only Common publishes the trusted dynamic tenant resource lifecycle contract.
simplepoint.rbac.managed-resource.enabled=true

# Reliable platform events; topology and SQL migrations must be provisioned before enabling.
simplepoint.events.enabled=${SIMPLEPOINT_EVENTS_ENABLED:false}
simplepoint.events.service=${spring.application.name}
simplepoint.events.declare-topology=false
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
management.health.rabbit.enabled=${simplepoint.events.enabled}

# Durable outbox accepts work during broker outages; monitor aggregate MQ health separately.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
spring.cloud.consul.discovery.health-check-path=/actuator/health/readiness
