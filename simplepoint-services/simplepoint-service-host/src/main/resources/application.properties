server.port=2555
spring.application.name=host

spring.cloud.consul.config.watch.enabled=false
# Retire idle upstream sockets before servlet keep-alive expiry; never replay writes at the gateway.
spring.cloud.gateway.server.webflux.httpclient.pool.max-idle-time=${SIMPLEPOINT_GATEWAY_POOL_MAX_IDLE:10s}
spring.cloud.gateway.server.webflux.httpclient.pool.eviction-interval=${SIMPLEPOINT_GATEWAY_POOL_EVICTION_INTERVAL:5s}
spring.cloud.gateway.server.webflux.routes[3].id=ai-api
spring.cloud.gateway.server.webflux.routes[3].uri=lb://ai
spring.cloud.gateway.server.webflux.routes[3].order=-100
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/ai/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[4].id=app-api
spring.cloud.gateway.server.webflux.routes[4].uri=lb://app
spring.cloud.gateway.server.webflux.routes[4].order=-100
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/app/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[5].id=workflow-api
spring.cloud.gateway.server.webflux.routes[5].uri=lb://workflow
spring.cloud.gateway.server.webflux.routes[5].order=-100
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/workflow/**
spring.cloud.gateway.server.webflux.routes[5].filters[0]=StripPrefix=1
simplepoint.host.mcp-session-affinity.enabled=${SIMPLEPOINT_MCP_SESSION_AFFINITY_ENABLED:true}
simplepoint.host.mcp-session-affinity.ttl=${SIMPLEPOINT_MCP_SESSION_AFFINITY_TTL:10m}
simplepoint.host.mcp-session-affinity.key-prefix=${SIMPLEPOINT_MCP_SESSION_AFFINITY_KEY_PREFIX:simplepoint:mcp:sessions:}

# Stable DNA API and module assets survive discovery changes during rolling restarts.
spring.cloud.gateway.server.webflux.routes[6].id=dna-api
spring.cloud.gateway.server.webflux.routes[6].uri=lb://dna
spring.cloud.gateway.server.webflux.routes[6].order=-100
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/dna/**
spring.cloud.gateway.server.webflux.routes[6].filters[0]=StripPrefix=1
