server.port=2895
spring.application.name=workflow-runtime
spring.sql.init.mode=never

simplepoint.ai.workflow.execution.enabled=${SIMPLEPOINT_AI_WORKFLOW_EXECUTION_ENABLED:true}
simplepoint.ai.workflow.execution.poll-interval=${SIMPLEPOINT_AI_WORKFLOW_EXECUTION_POLL_INTERVAL:500ms}
simplepoint.ai.workflow.execution.child-poll-interval=${SIMPLEPOINT_AI_WORKFLOW_CHILD_POLL_INTERVAL:500ms}
simplepoint.ai.workflow.execution.lease-duration=${SIMPLEPOINT_AI_WORKFLOW_EXECUTION_LEASE_DURATION:2m}
simplepoint.ai.workflow.execution.lease-heartbeat-interval=${SIMPLEPOINT_AI_WORKFLOW_EXECUTION_LEASE_HEARTBEAT_INTERVAL:20s}
simplepoint.ai.workflow.execution.batch-size=${SIMPLEPOINT_AI_WORKFLOW_EXECUTION_BATCH_SIZE:4}
simplepoint.ai.workflow.execution.maximum-concurrency=${SIMPLEPOINT_AI_WORKFLOW_EXECUTION_MAXIMUM_CONCURRENCY:8}
simplepoint.ai.workflow.execution.max-attempts=${SIMPLEPOINT_AI_WORKFLOW_EXECUTION_MAX_ATTEMPTS:32}
simplepoint.ai.workflow.execution.maximum-payload-bytes=${SIMPLEPOINT_AI_WORKFLOW_MAXIMUM_PAYLOAD_BYTES:1048576}
simplepoint.ai.workflow.execution.shutdown-timeout=${SIMPLEPOINT_AI_WORKFLOW_EXECUTION_SHUTDOWN_TIMEOUT:30s}

# Workflow Runtime submits exact pinned Agent and Skill child executions. Their
# dedicated workers remain independently scalable.
simplepoint.ai.agent.execution.enabled=false
simplepoint.ai.skill.execution.enabled=false
simplepoint.ai.skill.registry.enabled=false
simplepoint.ai.model-sync.enabled=false
