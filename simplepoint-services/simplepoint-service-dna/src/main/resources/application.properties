server.port=2777
spring.application.name=dna
spring.servlet.multipart.max-file-size=512MB
spring.servlet.multipart.max-request-size=512MB
simplepoint.dna.jdbc.socket.enabled=true
simplepoint.dna.jdbc.socket.port=15432
simplepoint.dna.runtime.form-remote.allowed-callers[0]=${SIMPLEPOINT_DNA_FORM_RUNTIME_CALLER:simplepoint-service-app}

# Reliable platform events; topology and SQL migrations must be provisioned before enabling.
simplepoint.events.enabled=${SIMPLEPOINT_EVENTS_ENABLED:false}
simplepoint.events.service=${spring.application.name}
simplepoint.events.declare-topology=false
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
management.health.rabbit.enabled=${simplepoint.events.enabled}

# Durable outbox accepts work during broker outages; monitor aggregate MQ health separately.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
spring.cloud.consul.discovery.health-check-path=/actuator/health/readiness
