server.port=2999
spring.application.name=authorization
spring.jpa.hibernate.ddl-auto=update
spring.security.oauth2.init-client.enabled=true
simplepoint.security.oauth2.external-provider.credential-encryption-key=${SIMPLEPOINT_OAUTH2_EXTERNAL_PROVIDER_CREDENTIAL_ENCRYPTION_KEY:dev-oauth2-provider-key-change-me}
simplepoint.security.oauth2.client-id-metadata.enabled=${SIMPLEPOINT_OAUTH_CLIENT_METADATA_ENABLED:true}
simplepoint.security.oauth2.client-id-metadata.allow-insecure-localhost=${SIMPLEPOINT_OAUTH_CLIENT_METADATA_ALLOW_INSECURE_LOCALHOST:false}
simplepoint.security.oauth2.client-id-metadata.connect-timeout=${SIMPLEPOINT_OAUTH_CLIENT_METADATA_CONNECT_TIMEOUT:5s}
simplepoint.security.oauth2.client-id-metadata.request-timeout=${SIMPLEPOINT_OAUTH_CLIENT_METADATA_REQUEST_TIMEOUT:10s}
simplepoint.security.oauth2.client-id-metadata.cache-ttl=${SIMPLEPOINT_OAUTH_CLIENT_METADATA_CACHE_TTL:5m}
simplepoint.security.oauth2.client-id-metadata.max-cache-entries=${SIMPLEPOINT_OAUTH_CLIENT_METADATA_MAX_CACHE_ENTRIES:1000}
simplepoint.security.oauth2.client-id-metadata.max-response-bytes=${SIMPLEPOINT_OAUTH_CLIENT_METADATA_MAX_RESPONSE_BYTES:65536}
simplepoint.security.oauth2.client-id-metadata.max-redirect-uris=${SIMPLEPOINT_OAUTH_CLIENT_METADATA_MAX_REDIRECT_URIS:20}
simplepoint.security.oauth2.client-id-metadata.max-document-uri-length=${SIMPLEPOINT_OAUTH_CLIENT_METADATA_MAX_URI_LENGTH:2048}
simplepoint.security.oauth2.client-id-metadata.allowed-scopes[0]=mcp.invoke
