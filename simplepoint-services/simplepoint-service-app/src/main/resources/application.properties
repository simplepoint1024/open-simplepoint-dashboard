server.port=2999
spring.application.name=app
spring.sql.init.mode=always
management.endpoints.web.exposure.include=health,info,metrics

# Explicit ownership avoids selecting another service that also imports tenant APIs.
simplepoint.service-router.routes[saas.managed-resource:1]=common
# DNA publication has a 30 second target transaction budget plus remote preparation.
simplepoint.service-router.http.read-timeout=65s

# Form submissions call the workflow owner; callbacks accept only its machine identity.
simplepoint.service-router.routes[workflow.business-runtime:1]=workflow
simplepoint.app.form.workflow-remote.allowed-callers[0]=${SIMPLEPOINT_APP_WORKFLOW_CALLER:simplepoint-service-workflow}

# Reliable platform events; topology and SQL migrations must be provisioned before enabling.
simplepoint.events.enabled=${SIMPLEPOINT_EVENTS_ENABLED:false}
simplepoint.events.service=${spring.application.name}
simplepoint.events.declare-topology=false
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
management.health.rabbit.enabled=${simplepoint.events.enabled}

# Durable outbox accepts work during broker outages; monitor aggregate MQ health separately.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
spring.cloud.consul.discovery.health-check-path=/actuator/health/readiness
