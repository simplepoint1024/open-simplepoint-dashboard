server.port=2894
spring.application.name=agent-runtime
spring.sql.init.mode=never

simplepoint.ai.agent.execution.enabled=${SIMPLEPOINT_AI_AGENT_EXECUTION_ENABLED:true}
simplepoint.ai.agent.execution.poll-interval=${SIMPLEPOINT_AI_AGENT_EXECUTION_POLL_INTERVAL:500ms}
simplepoint.ai.agent.execution.skill-poll-interval=${SIMPLEPOINT_AI_AGENT_SKILL_POLL_INTERVAL:500ms}
simplepoint.ai.agent.execution.lease-duration=${SIMPLEPOINT_AI_AGENT_EXECUTION_LEASE_DURATION:2m}
simplepoint.ai.agent.execution.lease-heartbeat-interval=${SIMPLEPOINT_AI_AGENT_EXECUTION_LEASE_HEARTBEAT_INTERVAL:20s}
simplepoint.ai.agent.execution.batch-size=${SIMPLEPOINT_AI_AGENT_EXECUTION_BATCH_SIZE:4}
simplepoint.ai.agent.execution.maximum-concurrency=${SIMPLEPOINT_AI_AGENT_EXECUTION_MAXIMUM_CONCURRENCY:8}
simplepoint.ai.agent.execution.max-attempts=${SIMPLEPOINT_AI_AGENT_EXECUTION_MAX_ATTEMPTS:8}
simplepoint.ai.agent.execution.maximum-payload-bytes=${SIMPLEPOINT_AI_AGENT_MAXIMUM_PAYLOAD_BYTES:262144}
simplepoint.ai.agent.execution.shutdown-timeout=${SIMPLEPOINT_AI_AGENT_EXECUTION_SHUTDOWN_TIMEOUT:30s}

# Agent Runtime only submits pinned Skill executions. The AI control plane owns
# Skill workflow workers and registry mutations.
simplepoint.ai.skill.execution.enabled=false
simplepoint.ai.skill.registry.enabled=false
simplepoint.ai.model-sync.enabled=false
