server.port=2890
spring.application.name=mcp-gateway
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

simplepoint.mcp.gateway.connect-timeout=${SIMPLEPOINT_MCP_GATEWAY_CONNECT_TIMEOUT:10s}
simplepoint.mcp.gateway.initialization-timeout=${SIMPLEPOINT_MCP_GATEWAY_INITIALIZATION_TIMEOUT:15s}
simplepoint.mcp.gateway.request-timeout=${SIMPLEPOINT_MCP_GATEWAY_REQUEST_TIMEOUT:30s}
simplepoint.mcp.gateway.max-arguments-bytes=${SIMPLEPOINT_MCP_GATEWAY_MAX_ARGUMENTS_BYTES:1048576}
simplepoint.mcp.gateway.max-result-bytes=${SIMPLEPOINT_MCP_GATEWAY_MAX_RESULT_BYTES:10485760}
simplepoint.mcp.gateway.max-oauth-response-bytes=${SIMPLEPOINT_MCP_GATEWAY_MAX_OAUTH_RESPONSE_BYTES:1048576}
simplepoint.mcp.gateway.oauth-proxy-url=${SIMPLEPOINT_MCP_GATEWAY_OAUTH_PROXY_URL:${HTTPS_PROXY:${https_proxy:${HTTP_PROXY:${http_proxy:}}}}}
simplepoint.mcp.gateway.oauth-no-proxy=${SIMPLEPOINT_MCP_GATEWAY_OAUTH_NO_PROXY:${NO_PROXY:${no_proxy:}}}
simplepoint.mcp.gateway.max-protocol-request-bytes=${SIMPLEPOINT_MCP_MAX_PROTOCOL_REQUEST_BYTES:2097152}
simplepoint.mcp.gateway.allow-insecure-oauth-endpoints=${SIMPLEPOINT_MCP_GATEWAY_ALLOW_INSECURE_OAUTH_ENDPOINTS:false}
simplepoint.mcp.gateway.internal-header-name=${SIMPLEPOINT_MCP_GATEWAY_INTERNAL_HEADER:X-SimplePoint-MCP-Gateway-Token}
simplepoint.mcp.gateway.internal-token=${SIMPLEPOINT_MCP_GATEWAY_INTERNAL_TOKEN:}
simplepoint.mcp.gateway.capability-token-signing-key=${SIMPLEPOINT_MCP_CAPABILITY_TOKEN_SIGNING_KEY:}
simplepoint.mcp.gateway.capability-token-issuer=${SIMPLEPOINT_MCP_CAPABILITY_TOKEN_ISSUER:simplepoint-ai-control-plane}
simplepoint.mcp.gateway.capability-token-audience=${SIMPLEPOINT_MCP_CAPABILITY_TOKEN_AUDIENCE:simplepoint-mcp-gateway}
simplepoint.mcp.gateway.capability-token-clock-skew=${SIMPLEPOINT_MCP_CAPABILITY_TOKEN_CLOCK_SKEW:5s}
simplepoint.mcp.gateway.capability-token-maximum-ttl=${SIMPLEPOINT_MCP_CAPABILITY_TOKEN_MAXIMUM_TTL:5m}
simplepoint.mcp.gateway.capability-token-replay-key-prefix=${SIMPLEPOINT_MCP_CAPABILITY_TOKEN_REPLAY_KEY_PREFIX:simplepoint:mcp:capability:used:}
simplepoint.mcp.gateway.control-plane-base-url=${SIMPLEPOINT_MCP_CONTROL_PLANE_BASE_URL:http://ai:2888}
simplepoint.mcp.gateway.publication-manifest-ttl=${SIMPLEPOINT_MCP_PUBLICATION_MANIFEST_TTL:30s}
simplepoint.mcp.gateway.max-remote-sessions=${SIMPLEPOINT_MCP_MAX_REMOTE_SESSIONS:256}
simplepoint.mcp.gateway.max-subscriptions-per-session=${SIMPLEPOINT_MCP_MAX_SUBSCRIPTIONS_PER_SESSION:1000}
simplepoint.mcp.gateway.remote-session-idle-timeout=${SIMPLEPOINT_MCP_REMOTE_SESSION_IDLE_TIMEOUT:5m}
simplepoint.mcp.gateway.event-channel=${SIMPLEPOINT_MCP_EVENT_CHANNEL:simplepoint:mcp:gateway:events}
simplepoint.mcp.gateway.publication-issuer-uri=${SIMPLEPOINT_MCP_PUBLICATION_ISSUER_URI:http://localhost:9000}
simplepoint.mcp.gateway.publication-jwk-set-uri=${SIMPLEPOINT_MCP_PUBLICATION_JWK_SET_URI:http://authorization:9000/oauth2/jwks}
simplepoint.mcp.gateway.oauth-client-metadata-document-uri=${SIMPLEPOINT_MCP_OAUTH_CLIENT_METADATA_URI:}
simplepoint.mcp.gateway.oauth-client-name=${SIMPLEPOINT_MCP_OAUTH_CLIENT_NAME:Open SimplePoint MCP Gateway}
simplepoint.mcp.gateway.oauth-client-redirect-uris=${SIMPLEPOINT_MCP_OAUTH_REDIRECT_URIS:}
simplepoint.mcp.gateway.oauth-client-uri=${SIMPLEPOINT_MCP_OAUTH_CLIENT_URI:}
simplepoint.mcp.gateway.oauth-client-logo-uri=${SIMPLEPOINT_MCP_OAUTH_CLIENT_LOGO_URI:}
simplepoint.mcp.gateway.runtime-mtls-enabled=${SIMPLEPOINT_MCP_RUNTIME_MTLS_ENABLED:false}
simplepoint.mcp.gateway.runtime-mtls-key-store=${SIMPLEPOINT_MCP_RUNTIME_MTLS_KEY_STORE:}
simplepoint.mcp.gateway.runtime-mtls-key-store-password=${SIMPLEPOINT_MCP_RUNTIME_MTLS_KEY_STORE_PASSWORD:}
simplepoint.mcp.gateway.runtime-mtls-trust-store=${SIMPLEPOINT_MCP_RUNTIME_MTLS_TRUST_STORE:}
simplepoint.mcp.gateway.runtime-mtls-trust-store-password=${SIMPLEPOINT_MCP_RUNTIME_MTLS_TRUST_STORE_PASSWORD:}
simplepoint.mcp.gateway.runtime-mtls-identity=${SIMPLEPOINT_MCP_RUNTIME_MTLS_IDENTITY:spiffe://open-simplepoint/mcp-gateway}

spring.data.redis.host=${SIMPLEPOINT_REDIS_HOST:redis}
spring.data.redis.port=${SIMPLEPOINT_REDIS_PORT:6379}

management.endpoints.web.exposure.include=health,info,metrics
