spring.application.name=simplepoint-standalone
spring.main.web-application-type=servlet
spring.main.allow-bean-definition-overriding=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.flyway.enabled=false
simplepoint.security.browser.enabled=true
simplepoint.service-router.internal-auth.mode=oauth2
simplepoint.service-router.consumer.local-isolation=true
# A complete standalone resolves its contracts locally. Advertising duplicate providers into
# a shared microservice catalog requires an explicit deployment routing plan.
simplepoint.service-router.provider.enabled=false
spring.cloud.consul.enabled=false
simplepoint.events.declare-topology=false
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.forward-headers-strategy=framework
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
