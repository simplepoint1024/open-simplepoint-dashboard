<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="#{error.page.title} + ' · SimplePoint'">Request failed · SimplePoint</title>
  <link rel="stylesheet" href="identity.css">
</head>
<body class="identity-page">
<main class="identity-shell narrow">
  <div class="identity-brand"><span class="identity-brand-mark">S·P</span><span>SimplePoint</span></div>
  <p class="identity-tag" th:text="${status != null ? status : 'ERROR'}">ERROR</p>
  <h1 class="identity-title" th:text="#{error.page.title}">The request could not be completed</h1>
  <p class="identity-subtitle" th:text="#{error.page.message}">No account changes were made. Return to sign in and try again.</p>
  <div class="identity-alert error" th:if="${error != null}" th:text="${error}">Error</div>
  <div class="identity-options">
    <a class="identity-button" href="login" th:text="#{action.backToLogin}">Back to sign in</a>
    <button class="identity-button secondary" type="button" onclick="history.back()" th:text="#{action.goBack}">Go back</button>
  </div>
  <p class="identity-note" th:if="${path != null}"><span th:text="#{error.page.path}">Request path</span>: <code th:text="${path}"></code></p>
</main>
</body>
</html>
